name: AWX Operator unified dev validation
on:
  workflow_dispatch:
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Build operator image without publishing
        run: docker build --file Dockerfile --build-arg DEFAULT_AWX_VERSION=24.6.1 --build-arg OPERATOR_VERSION=development --tag awx-operator-dev:ci .
      - name: Record immutable local image ID
        run: |
          docker image inspect awx-operator-dev:ci --format '{{.Id}}' | tee operator-image-id.txt
      - name: Check operator binary presence
        run: |
          docker run --rm --entrypoint /bin/sh awx-operator-dev:ci -c 'test -x /usr/local/bin/ansible-operator && test -f "$HOME/watches.yaml"'


      - name: Inventory Python dependencies and installation paths
        run: |
          docker run --rm --entrypoint /bin/sh awx-operator-dev:ci -c '
            set -eu
            echo "PYTHON_EXECUTABLES"
            command -v python3 || true
            command -v pip || true
            echo "PYTHON_RUNTIME"
            python3 -c "import sys, sysconfig; print(sys.executable); print(sys.version); print(sysconfig.get_paths())"
            echo "DEPENDENCY_METADATA"
            python3 -c "import importlib.metadata as m; names=(\"pyasn1\",\"urllib3\",\"virtualenv\",\"cryptography\"); print([(n, m.version(n)) for n in names])"
            python3 -c "import importlib.metadata as m; print(m.distribution(\"pyasn1\").locate_file(\"\"))"
            python3 -c "import importlib.metadata as m; print(m.distribution(\"urllib3\").locate_file(\"\"))"
            python3 -c "import importlib.metadata as m; print(m.distribution(\"virtualenv\").locate_file(\"\"))"
            python3 -c "import importlib.metadata as m; print(m.distribution(\"cryptography\").locate_file(\"\"))"
            echo "PIP_AVAILABILITY"
            python3 -m pip --version || true
          '
      - name: Verify patched Python runtime
        run: |
          docker run --rm --entrypoint /bin/sh awx-operator-dev:ci -c '
            set -eu
            python3 -m pip check
            python3 -c "import importlib.metadata as m; assert m.version(\"pip\") == \"25.3\""
            python3 -c "import importlib.metadata as m; assert m.version(\"pyasn1\") == \"0.6.4\""
            python3 -c "import importlib.metadata as m; assert m.version(\"urllib3\") == \"2.8.0\""
            python3 -c "import importlib.metadata as m; assert m.version(\"virtualenv\") == \"21.7.13\""
            python3 -c "import importlib.metadata as m; assert m.version(\"cryptography\") == \"50.0.0\""
            python3 -c "import ssl, cryptography, urllib3, virtualenv, pyasn1; print(\"Python imports OK\")"
          '
      - name: Capture Go binary provenance and OS package versions
        run: |
          mkdir -p security-evidence
          cid=$(docker create --entrypoint /bin/sh awx-operator-dev:ci)
          docker cp "$cid:/usr/local/bin/ansible-operator" security-evidence/ansible-operator
          docker rm "$cid"
          go version -m security-evidence/ansible-operator | tee security-evidence/go-build-info.txt
          test -s security-evidence/go-build-info.txt
          docker run --rm --entrypoint /bin/sh awx-operator-dev:ci -c '
            rpm -q expat gnutls libblkid libmount libsmartcols libuuid python3.12-pip-wheel
          ' | tee security-evidence/rpm-versions.txt
      - name: Scan built image with Trivy (read-only, no publishing)
        run: |
          mkdir -p trivy-reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/trivy-reports:/reports" \
            aquasec/trivy:0.75.0 image \
            --image-src docker \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --format json \
            --output /reports/awx-operator-trivy.json \
            awx-operator-dev:ci
      - name: Summarize findings and validate report
        if: success()
        run: |
          test -s trivy-reports/awx-operator-trivy.json
          python3 - <<'PY'
          import json, os
          with open('trivy-reports/awx-operator-trivy.json') as f:
              data=json.load(f)
          if 'Results' not in data or 'SchemaVersion' not in data:
              raise SystemExit('Trivy report invalid or incomplete')
          counts={'CRITICAL':0,'HIGH':0}
          for result in data.get('Results',[]):
              for vuln in result.get('Vulnerabilities') or []:
                  severity=vuln.get('Severity')
                  if severity in counts: counts[severity]+=1
          line=f"Trivy awx-operator: CRITICAL={counts['CRITICAL']}, HIGH={counts['HIGH']}"
          print(line)
          rpm=[]
          for result in data.get('Results',[]):
              if result.get('Type') == 'redhat':
                  for v in result.get('Vulnerabilities') or []:
                      if v.get('Severity') in counts:
                          rpm.append((v.get('VulnerabilityID'),v.get('PkgName'),v.get('InstalledVersion'),v.get('FixedVersion') or 'NO_VENDOR_FIX'))
          with open('trivy-reports/rpm-open-findings.tsv','w') as out:
              out.write('CVE\\tPACKAGE\\tINSTALLED\\tFIXED_VERSION\\n')
              for row in rpm:
                  out.write('\\t'.join(str(x) for x in row)+'\\n')
          print(f'RPM findings: {len(rpm)}; without fix: {sum(x[3]=="NO_VENDOR_FIX" for x in rpm)}')
          if counts['CRITICAL'] or counts['HIGH'] > 9:
              raise SystemExit('Security regression: CRITICAL found or HIGH exceeded reviewed baseline of nine')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write(line+'\\n')
          PY
      - name: Save vulnerability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awx-operator-trivy-report
          path: |
            trivy-reports/awx-operator-trivy.json
            trivy-reports/rpm-open-findings.tsv
            operator-image-id.txt
            security-evidence/go-build-info.txt
            security-evidence/rpm-versions.txt
          if-no-files-found: warn
          retention-days: 30
  molecule:
    runs-on: ubuntu-latest
    name: molecule
    strategy:
      matrix:
        ansible_args:
          - --skip-tags=replicas
          - -t replicas
    env:
      DOCKER_API_VERSION: "1.44"
      DEBUG_OUTPUT_DIR: /tmp/awx_operator_molecule_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r molecule/requirements.txt

      - name: Install Collections
        run: |
          ansible-galaxy collection install -r molecule/requirements.yml

      - name: Run Molecule
        env:
          MOLECULE_VERBOSITY: 3
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          STORE_DEBUG_OUTPUT: true
        run: |
          sudo rm -f $(which kustomize)
          make kustomize
          KUSTOMIZE_PATH=$(readlink -f bin/kustomize) molecule test -s kind -- ${{ matrix.ansible_args }}

      - name: Upload artifacts for failed tests if Run Molecule fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: awx_operator_molecule_test
          path: ${{ env.DEBUG_OUTPUT_DIR }}
  no-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Check no_log statements
        run: |
          set +e
          no_log=$(grep -nr ' no_log:' roles | grep -v '"{{ no_log }}"')
          if [ -n "${no_log}" ]; then
            echo 'Please update the following no_log statement(s) with the "{{ no_log }}" value'
            echo "${no_log}"
            exit 1
          fi
  nox-sessions:
    uses: ./.github/workflows/reusable-nox.yml
